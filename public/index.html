<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meri Messenger App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #e5ddd5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #075e54;
      color: white;
      padding: 15px;
      font-size: 18px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 70%;
      padding: 8px 12px;
      border-radius: 8px;
      background: white;
      align-self: flex-start;
    }
    .msg.me {
      background: #dcf8c6;
      align-self: flex-end;
    }
    .msg .name {
      font-size: 12px;
      color: #075e54;
      font-weight: bold;
    }
    form {
      display: flex;
      padding: 10px;
      background: #f0f0f0;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 20px;
      outline: none;
    }
    button {
      background: #075e54;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>💬 Meri Messenger App</header>
  <div id="messages"></div>

  <form id="form">
    <input id="input" placeholder="Message likhein..." autocomplete="off" />
    <button>Bhejein</button>
  </form>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const myName = prompt("Apna naam likhein:") || "Anjaan";

    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    function addMessage(data) {
      const div = document.createElement("div");
      div.className = "msg" + (data.name === myName ? " me" : "");

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = data.name;

      const text = document.createElement("div");
      text.textContent = data.text;

      div.appendChild(name);
      div.appendChild(text);
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      if (input.value.trim() === "") return;
      socket.emit("chat message", { name: myName, text: input.value });
      input.value = "";
    });

    socket.on("history", (list) => {
      messages.innerHTML = "";
      list.forEach(addMessage);
    });

    socket.on("chat message", addMessage);
  </script>
</body>
</html>
